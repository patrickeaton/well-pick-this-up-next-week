<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>We'll Pick This Up Next Week</title>
    <meta name="description" content="A looping tabletop-RPG adventure. Finish the mission before your friends fall asleep." />
    <!-- Icons: the browser tab, the home screen, and installing as an app -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1d1518" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Next Week" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IM+Fell+English:ital@0;1&family=Jersey+10&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="title">We'll Pick This Up Next Week</div>
        <div class="meta">
          <span id="session-label"></span>
          <span class="dot">·</span>
          <span id="area-label"></span>
          <span class="clock"><span class="mi" aria-hidden="true">schedule</span> <span id="clock"></span></span>
          <button class="binder-btn quit-btn" id="quit-btn" data-act="quit" title="End the session" hidden><span class="mi" aria-hidden="true">bedtime</span><span class="btn-label"> End session</span></button>
          <button class="binder-btn" data-act="binder"><span class="mi" aria-hidden="true">menu_book</span> Binder <span id="binder-count"></span></button>
          <button class="binder-btn gear-btn" data-act="settings" title="Settings"><span class="mi" aria-hidden="true">settings</span></button>
        </div>
      </header>
      <main>
        <section class="stage">
          <div class="map-wrap">
            <div id="game"></div>
            <div id="dialog"></div>
            <div id="toasts"></div>
          </div>
          <p class="hint">Click things to walk over and explore, or click the floor to walk there. Number keys pick an action. Esc closes the dialog.</p>
        </section>
        <aside id="table"></aside>
      </main>
      <div id="overlay"></div>
      <div id="curtain"></div>
      <div id="notices" aria-live="polite"></div>
      <div id="rotate" aria-live="polite">
        <span class="mi" aria-hidden="true">screen_rotation</span>
        <p>Turn your phone sideways to play.</p>
        <p class="muted">Game night works best in landscape.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
